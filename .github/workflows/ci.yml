name: Check, test and build
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        deployment: [root, subpath]
    runs-on: ${{ matrix.os }}
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      SITE_URL: ${{ matrix.deployment == 'subpath' && 'https://dyyjs.com' || 'https://howielog.com' }}
      PUBLIC_BASE_PATH: ${{ matrix.deployment == 'subpath' && '/howielog' || '/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:http
      - run: npm audit --audit-level=moderate
