name: Check, test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        deployment: [root, subpath]
    runs-on: ${{ matrix.os }}
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      SITE_URL: ${{ matrix.deployment == 'subpath' && 'https://dyyjs.com' || 'https://howielog.com' }}
      PUBLIC_BASE_PATH: ${{ matrix.deployment == 'subpath' && '/howielog' || '/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:scale
      - run: npm run build
      - run: npm run test:http
      - run: npm audit --audit-level=moderate
      - name: Install rehearsal tools
        if: runner.os == 'Linux' && matrix.deployment == 'subpath'
        run: |
          sudo apt-get update
          sudo apt-get install -y caddy restic fonts-noto-cjk
      - name: Test encrypted backup round trip
        if: runner.os == 'Linux' && matrix.deployment == 'subpath'
        env:
          RESTIC_TEST_BINARY: /usr/bin/restic
        run: npm run test:restic
      - name: Rehearse Linux service, proxy and recovery
        if: runner.os == 'Linux' && matrix.deployment == 'subpath'
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,SITE_URL,PUBLIC_BASE_PATH "$(command -v node)" tests/linux-rehearsal.mjs
